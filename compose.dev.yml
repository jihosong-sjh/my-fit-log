name: myfit-dev
services:
  db:
    image: postgres:17.9-bookworm
    container_name: myfit-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:dev}
      POSTGRES_DB: ${POSTGRES_DB:-myfit_dev}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-dev:/var/lib/postgresql/data']
    networks: [myfit-network]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: myfit-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-myfit_dev}
      APP_URL: http://localhost:3000
      SESSION_SECRET: ${SESSION_SECRET:?Run pnpm setup:dev}
    ports: ['127.0.0.1:4000:4000']
    volumes:
      - ./apps/api/src:/app/apps/api/src
    networks: [myfit-network]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: myfit-web-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: 1
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/ui/src:/app/packages/ui/src
    networks: [myfit-network]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  db-test:
    image: postgres:17.9-bookworm
    container_name: myfit-db-test
    profiles: [test]
    restart: 'no'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: myfit_test
    ports: ['127.0.0.1:5433:5432']
    volumes: ['postgres-test:/var/lib/postgresql/data']
    networks: [myfit-network]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d myfit_test']
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  myfit-network:
    name: myfit-dev-network
volumes:
  postgres-dev:
    name: myfit-dev-postgres
  postgres-test:
    name: myfit-test-postgres
